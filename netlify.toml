[build]
  base = "app"
  command = "pnpm install --frozen-lockfile && pnpm build"
  publish = "dist/public"

[[redirects]]
  from = "/api/trpc/*"
  to = "/.netlify/functions/server/:splat"
  status = 200

[[redirects]]
  from = "/studio"
  to = "/studio/index.html"
  status = 200

[[redirects]]
  from = "/work"
  to = "/work/index.html"
  status = 200

[[redirects]]
  from = "/worlds"
  to = "/worlds/index.html"
  status = 200

[[redirects]]
  from = "/mythology"
  to = "/mythology/index.html"
  status = 200

[[redirects]]
  from = "/contact"
  to = "/contact/index.html"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
